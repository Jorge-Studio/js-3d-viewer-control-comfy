<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS3D Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #ccc; }
#canvas-container { width: 100%; height: 100%; position: relative; }
canvas { display: block; width: 100%; height: 100%; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 14px; color: #888; display: none; text-align: center; }
#loading.active { display: block; }
#progress-bar { width: 200px; height: 4px; background: #333; border-radius: 2px; margin: 8px auto 0; overflow: hidden; }
#progress-fill { width: 0%; height: 100%; background: #6a9eff; transition: width 0.15s; }

.menu-bar { position: absolute; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 100; }
.menu-bar.left { left: 10px; }
.menu-bar.right { right: 10px; }
.menu-btn { width: 36px; height: 36px; border: 1px solid #444; border-radius: 6px; background: rgba(30,30,30,0.85); color: #ccc; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.15s, border-color 0.15s; }
.menu-btn:hover { background: rgba(60,60,60,0.9); border-color: #666; }
.menu-btn.active { background: rgba(80,120,200,0.5); border-color: #6a9eff; color: #fff; }

.panel { position: absolute; top: 10px; background: rgba(20,20,20,0.92); border: 1px solid #444; border-radius: 8px; padding: 12px; min-width: 220px; max-width: 280px; backdrop-filter: blur(8px); z-index: 99; display: none; font-size: 12px; max-height: calc(100% - 60px); overflow-y: auto; }
.panel.left-panel { left: 56px; }
.panel.right-panel { right: 56px; }
.panel.visible { display: block; }
.panel h3 { font-size: 12px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
.panel-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.panel-row label { font-size: 11px; color: #999; flex-shrink: 0; margin-right: 8px; }
.panel-row input[type="range"] { flex: 1; max-width: 110px; accent-color: #6a9eff; }
.panel-row input[type="color"] { width: 28px; height: 22px; border: 1px solid #555; border-radius: 4px; background: none; cursor: pointer; }
.panel-row input[type="checkbox"] { accent-color: #6a9eff; }
.panel-row input[type="number"] { width: 55px; background: #2a2a2a; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 2px 4px; font-size: 11px; text-align: right; }
.panel-row select { background: #2a2a2a; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 2px 4px; font-size: 11px; }
.panel-row .val { font-size: 10px; color: #666; min-width: 30px; text-align: right; }

#gizmo-bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 100; background: rgba(15,15,15,0.8); padding: 4px 6px; border-radius: 8px; border: 1px solid #333; backdrop-filter: blur(6px); }
#gizmo-bar .menu-btn { font-size: 13px; font-weight: 600; width: 32px; height: 32px; }

#info-bar { position: absolute; bottom: 14px; right: 10px; font-size: 10px; color: #555; z-index: 50; text-align: right; line-height: 1.4; }

#controls-hint { position: absolute; bottom: 14px; left: 10px; font-size: 9px; color: #444; z-index: 50; line-height: 1.3; }
</style>
</head>
<body>
<div id="canvas-container">
    <div id="loading" class="active">
        Select a 3D file to preview
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="menu-bar left">
        <button class="menu-btn" id="btn-scene" title="Scene">&#9633;</button>
        <button class="menu-btn" id="btn-model" title="Model">&#11042;</button>
        <button class="menu-btn" id="btn-camera" title="Camera">&#127909;</button>
        <button class="menu-btn" id="btn-light" title="Light">&#9728;</button>
    </div>

    <div class="menu-bar right">
        <button class="menu-btn" id="btn-snapshot" title="Capture snapshot">&#128248;</button>
        <button class="menu-btn" id="btn-fullscreen" title="Reset view">&#8634;</button>
    </div>

    <!-- Scene Panel -->
    <div class="panel left-panel" id="panel-scene">
        <h3>Scene</h3>
        <div class="panel-row"><label>Grid</label><input type="checkbox" id="opt-grid" checked></div>
        <div class="panel-row"><label>Background</label><input type="color" id="opt-bg-color" value="#1a1a1a"></div>
        <div class="panel-row"><label>Axes</label><input type="checkbox" id="opt-axes" checked></div>
        <div class="panel-row" id="bg-image-row" style="display:none"><label>BG Image</label><input type="checkbox" id="opt-bg-image" checked></div>
    </div>

    <!-- Model Panel -->
    <div class="panel left-panel" id="panel-model">
        <h3>Model</h3>
        <div class="panel-row"><label>Material</label>
            <select id="opt-material"><option value="original">Original</option><option value="wireframe">Wireframe</option><option value="normal">Normal Map</option><option value="points">Point Cloud</option><option value="flat">Flat Shading</option></select>
        </div>
        <div class="panel-row"><label>Up Axis</label>
            <select id="opt-up-axis"><option value="Y" selected>Y-Up</option><option value="Z">Z-Up</option></select>
        </div>
        <div class="panel-row"><label>Opacity</label><input type="range" id="opt-opacity" min="0" max="1" step="0.01" value="1"><span class="val" id="val-opacity">1.0</span></div>
        <div class="panel-row"><label>Point Size</label><input type="range" id="opt-point-size" min="0.0005" max="0.05" step="0.0005" value="0.003"><span class="val" id="val-point-size">0.003</span></div>
    </div>

    <!-- Camera Panel -->
    <div class="panel left-panel" id="panel-camera">
        <h3>Camera</h3>
        <div class="panel-row"><label>Type</label>
            <select id="opt-cam-type"><option value="perspective" selected>Perspective</option><option value="orthographic">Orthographic</option></select>
        </div>
        <div class="panel-row"><label>FOV</label><input type="range" id="opt-fov" min="5" max="120" step="1" value="50"><span class="val" id="val-fov">50</span></div>
        <div class="panel-row"><label>Pos X</label><input type="number" id="cam-px" value="2" step="0.1"></div>
        <div class="panel-row"><label>Pos Y</label><input type="number" id="cam-py" value="1.5" step="0.1"></div>
        <div class="panel-row"><label>Pos Z</label><input type="number" id="cam-pz" value="3" step="0.1"></div>
        <div class="panel-row"><label>Target X</label><input type="number" id="cam-tx" value="0" step="0.1"></div>
        <div class="panel-row"><label>Target Y</label><input type="number" id="cam-ty" value="0" step="0.1"></div>
        <div class="panel-row"><label>Target Z</label><input type="number" id="cam-tz" value="0" step="0.1"></div>
    </div>

    <!-- Light Panel -->
    <div class="panel left-panel" id="panel-light">
        <h3>Lighting</h3>
        <div class="panel-row"><label>Ambient</label><input type="range" id="opt-ambient" min="0" max="3" step="0.05" value="0.6"><span class="val" id="val-ambient">0.6</span></div>
        <div class="panel-row"><label>Directional</label><input type="range" id="opt-directional" min="0" max="5" step="0.05" value="1.0"><span class="val" id="val-directional">1.0</span></div>
        <div class="panel-row"><label>Light Color</label><input type="color" id="opt-light-color" value="#ffffff"></div>
        <div class="panel-row"><label>Light X</label><input type="number" id="light-px" value="5" step="0.5"></div>
        <div class="panel-row"><label>Light Y</label><input type="number" id="light-py" value="10" step="0.5"></div>
        <div class="panel-row"><label>Light Z</label><input type="number" id="light-pz" value="7" step="0.5"></div>
    </div>

    <div id="gizmo-bar">
        <button class="menu-btn active" id="gz-translate" title="Translate (T)">T</button>
        <button class="menu-btn" id="gz-rotate" title="Rotate (R)">R</button>
        <button class="menu-btn" id="gz-scale" title="Scale (S)">S</button>
        <button class="menu-btn" id="gz-none" title="Orbit only (Q)">Q</button>
    </div>

    <div id="controls-hint">LMB: Orbit · RMB: Pan · Scroll: Zoom</div>
    <div id="info-bar">JS3D Viewer</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://esm.sh/three@0.170.0",
        "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// ─── Constants ───────────────────────────────────────────────────────────────
const SH_C0 = 0.28209479177387814;
const OPACITY_THRESHOLD = 0.02;

const PLY_TYPE_SIZES = {
    float: 4, float32: 4, double: 8, float64: 8,
    uchar: 1, uint8: 1, char: 1, int8: 1,
    ushort: 2, uint16: 2, short: 2, int16: 2,
    uint: 4, uint32: 4, int: 4, int32: 4,
};

function plyReadValue(dataView, offset, type, littleEndian) {
    switch (type) {
        case 'float': case 'float32': return dataView.getFloat32(offset, littleEndian);
        case 'double': case 'float64': return dataView.getFloat64(offset, littleEndian);
        case 'uchar': case 'uint8': return dataView.getUint8(offset);
        case 'char': case 'int8': return dataView.getInt8(offset);
        case 'ushort': case 'uint16': return dataView.getUint16(offset, littleEndian);
        case 'short': case 'int16': return dataView.getInt16(offset, littleEndian);
        case 'uint': case 'uint32': return dataView.getUint32(offset, littleEndian);
        case 'int': case 'int32': return dataView.getInt32(offset, littleEndian);
        default: return dataView.getFloat32(offset, littleEndian);
    }
}

function sigmoid(x) { return 1.0 / (1.0 + Math.exp(-x)); }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// ─── Renderer ────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
container.insertBefore(renderer.domElement, container.firstChild);

let contextLost = false;
renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    contextLost = true;
    showLoading('WebGL context lost — click Reset View to recover');
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    showLoading(null);
});

// ─── Scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

let camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.01, 1000);
camera.position.set(2, 1.5, 3);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.08;
orbitControls.target.set(0, 0, 0);

const transformControls = new TransformControls(camera, renderer.domElement);
scene.add(transformControls);
transformControls.addEventListener('dragging-changed', (e) => { orbitControls.enabled = !e.value; });

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);
const dirLightHelper = new THREE.DirectionalLightHelper(dirLight, 0.5);
dirLightHelper.visible = false;
scene.add(dirLightHelper);
const hemiLight = new THREE.HemisphereLight(0xb1e1ff, 0xb97a20, 0.3);
scene.add(hemiLight);

const gridHelper = new THREE.GridHelper(20, 40, 0x444444, 0x2a2a2a);
scene.add(gridHelper);
const axesHelper = new THREE.AxesHelper(2);
scene.add(axesHelper);

// ─── State ───────────────────────────────────────────────────────────────────
let currentModel = null;
let originalMaterials = new Map();
let isGaussianSplat = false;
let isLargePointCloud = false;
let loadingAbort = null;
let hasBackgroundImage = false;
let savedBgColor = '#1a1a1a';

function setBackgroundImage(url) {
    if (url) {
        hasBackgroundImage = true;
        container.style.backgroundImage = `url(${url})`;
        container.style.backgroundSize = 'contain';
        container.style.backgroundPosition = 'center';
        container.style.backgroundRepeat = 'no-repeat';
        container.style.backgroundColor = '#111';
        scene.background = null;
        renderer.setClearColor(0x000000, 0);
        document.getElementById('bg-image-row').style.display = 'flex';
        document.getElementById('opt-bg-image').checked = true;
    } else {
        hasBackgroundImage = false;
        container.style.backgroundImage = 'none';
        container.style.backgroundColor = '';
        scene.background = new THREE.Color(savedBgColor);
        renderer.setClearColor(0x000000, 1);
        document.getElementById('bg-image-row').style.display = 'none';
    }
}

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const stlLoader = new STLLoader();
const plyLoader = new PLYLoader();
const fbxLoader = new FBXLoader();

// ─── UI helpers ──────────────────────────────────────────────────────────────
function showLoading(text) {
    const el = document.getElementById('loading');
    if (text === null) { el.classList.remove('active'); return; }
    el.classList.add('active');
    el.firstChild.textContent = text;
}
function setProgress(pct) {
    document.getElementById('progress-fill').style.width = Math.min(100, pct) + '%';
}

// ─── Custom binary PLY parser for Gaussian Splatting ─────────────────────────
function parsePLYHeader(buffer) {
    const bytes = new Uint8Array(buffer);
    const marker = [101,110,100,95,104,101,97,100,101,114,10]; // "end_header\n"
    let headerEnd = -1;
    const limit = Math.min(bytes.length, 65536);
    for (let i = 0; i < limit; i++) {
        let match = true;
        for (let j = 0; j < marker.length; j++) {
            if (bytes[i + j] !== marker[j]) { match = false; break; }
        }
        if (match) { headerEnd = i + marker.length; break; }
    }
    if (headerEnd < 0) return null;

    const headerText = new TextDecoder().decode(bytes.subarray(0, headerEnd));
    const lines = headerText.split('\n');

    let format = '';
    let vertexCount = 0;
    const properties = [];
    let inVertex = false;
    let hasOtherElements = false;

    for (const line of lines) {
        const parts = line.trim().split(/\s+/);
        if (parts[0] === 'format') format = parts[1];
        if (parts[0] === 'element') {
            if (parts[1] === 'vertex') { vertexCount = parseInt(parts[2]); inVertex = true; }
            else { inVertex = false; hasOtherElements = true; }
        }
        if (parts[0] === 'property' && inVertex && parts[1] !== 'list') {
            properties.push({ type: parts[1], name: parts[2] });
        }
    }

    const propNames = new Set(properties.map(p => p.name));
    const isGaussianSplat = propNames.has('f_dc_0') && propNames.has('f_dc_1') && propNames.has('f_dc_2');
    const littleEndian = format.includes('little');

    let stride = 0;
    const propMap = {};
    for (const p of properties) {
        propMap[p.name] = { offset: stride, type: p.type };
        stride += PLY_TYPE_SIZES[p.type] || 4;
    }

    return { format, vertexCount, properties, propMap, stride, dataOffset: headerEnd, isGaussianSplat, littleEndian };
}

async function fetchWithProgress(url, onProgress) {
    const response = await fetch(url, { mode: 'cors' });
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

    const contentLength = parseInt(response.headers.get('Content-Length') || '0');

    if (!response.body || contentLength === 0) {
        const buffer = await response.arrayBuffer();
        onProgress(100);
        return buffer;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (contentLength > 0) onProgress(Math.round((received / contentLength) * 100));
    }

    const result = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
        result.set(chunk, offset);
        offset += chunk.length;
    }
    return result.buffer;
}

async function loadGaussianSplatPLY(url) {
    showLoading('Downloading PLY file...');
    setProgress(0);

    const buffer = await fetchWithProgress(url, (pct) => {
        setProgress(pct * 0.7);
        showLoading(`Downloading... ${pct}%`);
    });

    showLoading('Parsing PLY header...');
    setProgress(72);

    const header = parsePLYHeader(buffer);
    if (!header) throw new Error('Invalid PLY file');
    if (!header.isGaussianSplat) return null;
    if (header.format === 'ascii') return null;

    const { vertexCount, propMap, stride, dataOffset, littleEndian } = header;

    showLoading(`Parsing ${vertexCount.toLocaleString()} splat points...`);
    setProgress(75);

    const dataView = new DataView(buffer, dataOffset);

    const xOff = propMap['x']?.offset;
    const yOff = propMap['y']?.offset;
    const zOff = propMap['z']?.offset;
    const dc0Off = propMap['f_dc_0']?.offset;
    const dc1Off = propMap['f_dc_1']?.offset;
    const dc2Off = propMap['f_dc_2']?.offset;
    const opOff = propMap['opacity']?.offset;

    if (xOff === undefined || yOff === undefined || zOff === undefined) {
        throw new Error('PLY missing position properties');
    }

    const xType = propMap['x'].type;
    const yType = propMap['y'].type;
    const zType = propMap['z'].type;
    const dcType = propMap['f_dc_0']?.type || 'float';
    const opType = propMap['opacity']?.type || 'float';

    const positions = new Float32Array(vertexCount * 3);
    const colors = new Float32Array(vertexCount * 3);
    let validCount = 0;

    const batchSize = 100000;

    for (let i = 0; i < vertexCount; i++) {
        const base = i * stride;

        if (opOff !== undefined) {
            const rawOp = plyReadValue(dataView, base + opOff, opType, littleEndian);
            if (sigmoid(rawOp) < OPACITY_THRESHOLD) continue;
        }

        const px = plyReadValue(dataView, base + xOff, xType, littleEndian);
        const py = plyReadValue(dataView, base + yOff, yType, littleEndian);
        const pz = plyReadValue(dataView, base + zOff, zType, littleEndian);

        if (!isFinite(px) || !isFinite(py) || !isFinite(pz)) continue;

        positions[validCount * 3]     = px;
        positions[validCount * 3 + 1] = py;
        positions[validCount * 3 + 2] = pz;

        if (dc0Off !== undefined) {
            const r = plyReadValue(dataView, base + dc0Off, dcType, littleEndian);
            const g = plyReadValue(dataView, base + dc1Off, dcType, littleEndian);
            const b = plyReadValue(dataView, base + dc2Off, dcType, littleEndian);
            colors[validCount * 3]     = clamp01(r * SH_C0 + 0.5);
            colors[validCount * 3 + 1] = clamp01(g * SH_C0 + 0.5);
            colors[validCount * 3 + 2] = clamp01(b * SH_C0 + 0.5);
        } else {
            colors[validCount * 3] = colors[validCount * 3 + 1] = colors[validCount * 3 + 2] = 0.7;
        }

        validCount++;

        if (i > 0 && i % batchSize === 0) {
            setProgress(75 + Math.round((i / vertexCount) * 20));
            await new Promise(r => setTimeout(r, 0));
        }
    }

    showLoading(`Building geometry (${validCount.toLocaleString()} points)...`);
    setProgress(96);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions.slice(0, validCount * 3), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors.slice(0, validCount * 3), 3));
    geometry.computeBoundingSphere();

    const autoSize = Math.min(0.03, Math.max(0.001, 2.0 / Math.sqrt(validCount)));

    const material = new THREE.PointsMaterial({
        size: autoSize,
        vertexColors: true,
        sizeAttenuation: true,
    });

    const points = new THREE.Points(geometry, material);
    points.raycast = () => {};

    const sizeSlider = document.getElementById('opt-point-size');
    sizeSlider.value = autoSize;
    document.getElementById('val-point-size').textContent = autoSize.toFixed(4);

    setProgress(100);
    return { object: points, vertexCount: validCount, isGS: true };
}

// ─── Model management ────────────────────────────────────────────────────────
function clearModel() {
    if (currentModel) {
        try { transformControls.detach(); } catch (_) {}
        scene.remove(currentModel);
        currentModel.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
                if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                else child.material.dispose();
            }
        });
        currentModel = null;
        originalMaterials.clear();
        isGaussianSplat = false;
        isLargePointCloud = false;
    }
}

function centerAndScale(object) {
    const box = new THREE.Box3().setFromObject(object);
    if (box.isEmpty()) return;
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) {
        const s = 2.0 / maxDim;
        object.scale.multiplyScalar(s);
        object.position.sub(center.multiplyScalar(s));
    }
}

function storeOriginalMaterials(object) {
    originalMaterials.clear();
    object.traverse((child) => {
        if (child.isMesh && child.material) {
            originalMaterials.set(child.uuid, child.material.clone ? child.material.clone() : child.material);
        }
        if (child.isPoints && child.material) {
            originalMaterials.set(child.uuid, child.material.clone ? child.material.clone() : child.material);
        }
    });
}

function addModelToScene(object, opts = {}) {
    clearModel();

    isGaussianSplat = !!opts.isGS;
    isLargePointCloud = !!opts.isLargePointCloud;

    const wrapper = new THREE.Group();
    wrapper.add(object);
    centerAndScale(wrapper);

    if (isGaussianSplat || isLargePointCloud) {
        object.traverse(child => {
            if (child.isPoints) child.raycast = () => {};
        });
    }

    storeOriginalMaterials(wrapper);
    scene.add(wrapper);
    currentModel = wrapper;

    if (isGaussianSplat || isLargePointCloud) {
        setGizmoMode('none');
    } else {
        setGizmoMode('translate');
    }

    orbitControls.target.set(0, 0, 0);
    camera.position.set(2, 1.5, 3);
    orbitControls.update();
    updateInfoBar(opts.vertexCount);
    showLoading(null);

    setTimeout(() => { if (!contextLost && currentModel) captureSnapshot(); }, 500);
}

function updateInfoBar(vertexOverride) {
    let info = 'JS3D Viewer';
    if (currentModel) {
        let verts = 0, faces = 0;
        currentModel.traverse((child) => {
            if (child.geometry) {
                const pos = child.geometry.getAttribute('position');
                if (pos) verts += pos.count;
                if (child.geometry.index) faces += child.geometry.index.count / 3;
            }
        });
        if (vertexOverride) verts = vertexOverride;
        info = `Verts: ${verts.toLocaleString()}`;
        if (faces > 0) info += ` | Faces: ${faces.toLocaleString()}`;
        if (isGaussianSplat) info += ' | Gaussian Splat';
    }
    document.getElementById('info-bar').textContent = info;
}

// ─── Model loading ───────────────────────────────────────────────────────────
async function loadModel(url, format) {
    showLoading('Loading...');
    setProgress(5);

    if (loadingAbort) { loadingAbort.abort(); loadingAbort = null; }

    try {
        if (format === 'ply') {
            await loadPLYModel(url);
        } else {
            await loadStandardModel(url, format);
        }
    } catch (err) {
        console.error('[JS3D] Load error:', err);
        showLoading('Error: ' + (err.message || 'Failed to load model'));
    }
}

async function loadPLYModel(url) {
    try {
        const gsResult = await loadGaussianSplatPLY(url);
        if (gsResult) {
            addModelToScene(gsResult.object, { isGS: true, isLargePointCloud: true, vertexCount: gsResult.vertexCount });
            return;
        }
    } catch (err) {
        console.warn('[JS3D] GS PLY parse failed, trying standard PLYLoader:', err.message);
    }

    showLoading('Loading PLY with standard loader...');
    setProgress(10);
    return new Promise((resolve, reject) => {
        plyLoader.load(url, (geo) => {
            try {
                setProgress(85);
                geo.computeVertexNormals();
                const pos = geo.getAttribute('position');
                const count = pos ? pos.count : 0;
                const hasColor = geo.hasAttribute('color');
                let object;
                if (geo.index !== null) {
                    object = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
                        color: 0x888888, metalness: 0.3, roughness: 0.6, vertexColors: hasColor
                    }));
                } else {
                    const sz = count > 100000 ? 0.003 : count > 10000 ? 0.008 : 0.015;
                    object = new THREE.Points(geo, new THREE.PointsMaterial({
                        size: sz, vertexColors: hasColor, sizeAttenuation: true,
                        color: hasColor ? undefined : 0x88aaff,
                    }));
                    if (!hasColor) object.material.color = new THREE.Color(0x88aaff);
                }
                setProgress(95);
                addModelToScene(object, { isLargePointCloud: count > 50000 });
                resolve();
            } catch (e) { reject(e); }
        }, (xhr) => {
            if (xhr.total > 0) setProgress(10 + Math.round((xhr.loaded / xhr.total) * 70));
        }, reject);
    });
}

function loadStandardModel(url, format) {
    return new Promise((resolve, reject) => {
        const onProgress = (xhr) => {
            if (xhr.total > 0) setProgress(Math.min(90, Math.round((xhr.loaded / xhr.total) * 80) + 10));
        };
        const onError = (err) => { reject(err instanceof Error ? err : new Error(String(err))); };

        switch (format) {
            case 'glb': case 'gltf':
                gltfLoader.load(url, (gltf) => { setProgress(95); addModelToScene(gltf.scene); resolve(); }, onProgress, onError);
                break;
            case 'obj':
                objLoader.load(url, (obj) => { setProgress(95); addModelToScene(obj); resolve(); }, onProgress, onError);
                break;
            case 'stl':
                stlLoader.load(url, (geo) => {
                    geo.computeVertexNormals(); setProgress(95);
                    addModelToScene(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.3, roughness: 0.6 })));
                    resolve();
                }, onProgress, onError);
                break;
            case 'fbx':
                fbxLoader.load(url, (fbx) => { setProgress(95); addModelToScene(fbx); resolve(); }, onProgress, onError);
                break;
            default:
                gltfLoader.load(url, (gltf) => { setProgress(95); addModelToScene(gltf.scene); resolve(); }, onProgress, onError);
        }
    });
}

// ─── Panel toggles ───────────────────────────────────────────────────────────
const panels = { scene: 'panel-scene', model: 'panel-model', camera: 'panel-camera', light: 'panel-light' };
let activePanel = null;

function togglePanel(name) {
    Object.values(panels).forEach(id => document.getElementById(id).classList.remove('visible'));
    ['btn-scene', 'btn-model', 'btn-camera', 'btn-light'].forEach(id => document.getElementById(id).classList.remove('active'));
    if (activePanel === name) { activePanel = null; return; }
    activePanel = name;
    document.getElementById(panels[name]).classList.add('visible');
    document.getElementById('btn-' + name).classList.add('active');
}
document.getElementById('btn-scene').addEventListener('click', () => togglePanel('scene'));
document.getElementById('btn-model').addEventListener('click', () => togglePanel('model'));
document.getElementById('btn-camera').addEventListener('click', () => togglePanel('camera'));
document.getElementById('btn-light').addEventListener('click', () => togglePanel('light'));

// ─── Scene options ───────────────────────────────────────────────────────────
document.getElementById('opt-grid').addEventListener('change', (e) => { gridHelper.visible = e.target.checked; });
document.getElementById('opt-bg-color').addEventListener('input', (e) => {
    savedBgColor = e.target.value;
    if (!hasBackgroundImage) {
        scene.background = new THREE.Color(e.target.value);
    }
});
document.getElementById('opt-axes').addEventListener('change', (e) => { axesHelper.visible = e.target.checked; });
document.getElementById('opt-bg-image').addEventListener('change', (e) => {
    if (hasBackgroundImage) {
        container.style.backgroundImage = e.target.checked ? container.style.backgroundImage : 'none';
        if (!e.target.checked) {
            scene.background = new THREE.Color(savedBgColor);
            renderer.setClearColor(0x000000, 1);
        } else {
            scene.background = null;
            renderer.setClearColor(0x000000, 0);
        }
    }
});

// ─── Model options ───────────────────────────────────────────────────────────
document.getElementById('opt-material').addEventListener('change', (e) => {
    if (!currentModel) return;
    const mode = e.target.value;
    currentModel.traverse((child) => {
        if (!child.isMesh && !child.isPoints) return;
        const orig = originalMaterials.get(child.uuid);
        switch (mode) {
            case 'original': if (orig) child.material = orig.clone(); break;
            case 'wireframe': if (child.isMesh) child.material = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true }); break;
            case 'normal': if (child.isMesh) child.material = new THREE.MeshNormalMaterial(); break;
            case 'flat': if (child.isMesh) child.material = new THREE.MeshStandardMaterial({ color: 0x888888, flatShading: true, metalness: 0.2, roughness: 0.8 }); break;
            case 'points': break;
        }
    });
});

document.getElementById('opt-up-axis').addEventListener('change', (e) => {
    if (!currentModel) return;
    currentModel.rotation.set(0, 0, 0);
    if (e.target.value === 'Z') currentModel.rotation.x = -Math.PI / 2;
});

document.getElementById('opt-opacity').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('val-opacity').textContent = v.toFixed(2);
    if (!currentModel) return;
    currentModel.traverse((child) => {
        if (child.material) { child.material.transparent = v < 1; child.material.opacity = v; child.material.needsUpdate = true; }
    });
});

document.getElementById('opt-point-size').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('val-point-size').textContent = v.toFixed(4);
    if (!currentModel) return;
    currentModel.traverse((child) => { if (child.isPoints && child.material) child.material.size = v; });
});

// ─── Camera controls ─────────────────────────────────────────────────────────
document.getElementById('opt-cam-type').addEventListener('change', (e) => {
    const w = container.clientWidth, h = container.clientHeight;
    const oldPos = camera.position.clone(), oldTarget = orbitControls.target.clone();
    if (e.target.value === 'orthographic') {
        const f = 3, a = w / h;
        camera = new THREE.OrthographicCamera(-f * a, f * a, f, -f, 0.01, 1000);
    } else {
        camera = new THREE.PerspectiveCamera(parseFloat(document.getElementById('opt-fov').value), w / h, 0.01, 1000);
    }
    camera.position.copy(oldPos);
    orbitControls.object = camera;
    orbitControls.target.copy(oldTarget);
    transformControls.camera = camera;
    orbitControls.update();
});

document.getElementById('opt-fov').addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    document.getElementById('val-fov').textContent = v;
    if (camera.isPerspectiveCamera) { camera.fov = v; camera.updateProjectionMatrix(); }
});

function updateCamFields() {
    document.getElementById('cam-px').value = camera.position.x.toFixed(2);
    document.getElementById('cam-py').value = camera.position.y.toFixed(2);
    document.getElementById('cam-pz').value = camera.position.z.toFixed(2);
    document.getElementById('cam-tx').value = orbitControls.target.x.toFixed(2);
    document.getElementById('cam-ty').value = orbitControls.target.y.toFixed(2);
    document.getElementById('cam-tz').value = orbitControls.target.z.toFixed(2);
}

for (const id of ['cam-px','cam-py','cam-pz']) {
    document.getElementById(id).addEventListener('change', (e) => {
        const axis = id.charAt(id.length - 1);
        camera.position[axis] = parseFloat(e.target.value) || 0;
        orbitControls.update();
    });
}
for (const id of ['cam-tx','cam-ty','cam-tz']) {
    document.getElementById(id).addEventListener('change', (e) => {
        const axis = id.charAt(id.length - 1);
        orbitControls.target[axis] = parseFloat(e.target.value) || 0;
        orbitControls.update();
    });
}

// ─── Light controls ──────────────────────────────────────────────────────────
document.getElementById('opt-ambient').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('val-ambient').textContent = v.toFixed(2);
    ambientLight.intensity = v;
});
document.getElementById('opt-directional').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    document.getElementById('val-directional').textContent = v.toFixed(2);
    dirLight.intensity = v;
});
document.getElementById('opt-light-color').addEventListener('input', (e) => {
    const c = new THREE.Color(e.target.value);
    dirLight.color = c; ambientLight.color = c;
});

for (const id of ['light-px','light-py','light-pz']) {
    document.getElementById(id).addEventListener('change', (e) => {
        const axis = id.charAt(id.length - 1);
        dirLight.position[axis] = parseFloat(e.target.value) || 0;
        dirLightHelper.update();
    });
}

// ─── Gizmo ───────────────────────────────────────────────────────────────────
let currentGizmoMode = 'none';

function setGizmoMode(mode) {
    currentGizmoMode = mode;
    ['gz-translate', 'gz-rotate', 'gz-scale', 'gz-none'].forEach(id => document.getElementById(id).classList.remove('active'));

    try {
        if (mode === 'none') {
            transformControls.detach();
            document.getElementById('gz-none').classList.add('active');
        } else {
            if (currentModel) {
                transformControls.attach(currentModel);
                transformControls.setMode(mode);
            }
            document.getElementById('gz-' + mode).classList.add('active');
        }
    } catch (err) {
        console.warn('[JS3D] Gizmo error:', err.message);
        transformControls.detach();
        document.getElementById('gz-none').classList.add('active');
        currentGizmoMode = 'none';
    }
}

document.getElementById('gz-translate').addEventListener('click', () => setGizmoMode('translate'));
document.getElementById('gz-rotate').addEventListener('click', () => setGizmoMode('rotate'));
document.getElementById('gz-scale').addEventListener('click', () => setGizmoMode('scale'));
document.getElementById('gz-none').addEventListener('click', () => setGizmoMode('none'));
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    switch (e.key.toLowerCase()) {
        case 't': setGizmoMode('translate'); break;
        case 'r': setGizmoMode('rotate'); break;
        case 's': setGizmoMode('scale'); break;
        case 'q': setGizmoMode('none'); break;
    }
});

// ─── Snapshot ────────────────────────────────────────────────────────────────
document.getElementById('btn-snapshot').addEventListener('click', captureSnapshot);

function captureSnapshot() {
    if (contextLost) return;
    try {
        const prevBg = scene.background;
        const prevClear = renderer.getClearColor(new THREE.Color());
        const prevAlpha = renderer.getClearAlpha();
        const savedVis = {
            grid: gridHelper.visible,
            axes: axesHelper.visible,
            tc: transformControls.visible,
            dirHelper: dirLightHelper.visible,
        };

        gridHelper.visible = false;
        axesHelper.visible = false;
        transformControls.visible = false;
        dirLightHelper.visible = false;
        scene.background = null;
        renderer.setClearColor(0x000000, 0);

        renderer.render(scene, camera);
        const imageData = renderer.domElement.toDataURL('image/png');

        let maskData = '', normalData = '';
        if (currentModel) {
            const savedMats = new Map();
            currentModel.traverse(c => {
                if ((c.isMesh || c.isPoints) && c.material) {
                    savedMats.set(c.uuid, c.material);
                    c.material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                }
            });
            renderer.render(scene, camera);
            maskData = renderer.domElement.toDataURL('image/png');

            currentModel.traverse(c => { if (c.isMesh) c.material = new THREE.MeshNormalMaterial(); });
            renderer.render(scene, camera);
            normalData = renderer.domElement.toDataURL('image/png');

            currentModel.traverse(c => { if (savedMats.has(c.uuid)) c.material = savedMats.get(c.uuid); });
        }

        scene.background = prevBg;
        renderer.setClearColor(prevClear, prevAlpha);
        gridHelper.visible = savedVis.grid;
        axesHelper.visible = savedVis.axes;
        transformControls.visible = savedVis.tc;
        dirLightHelper.visible = savedVis.dirHelper;

        window.parent.postMessage({
            type: 'js3d_snapshot', image: imageData, mask: maskData, normal: normalData,
            camera: {
                cameraType: camera.isPerspectiveCamera ? 'perspective' : 'orthographic',
                fov: camera.fov || 50,
                position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
                target: { x: orbitControls.target.x, y: orbitControls.target.y, z: orbitControls.target.z },
                zoom: camera.zoom,
            },
        }, '*');
    } catch (err) {
        console.error('[JS3D] Snapshot error:', err);
    }
}

// ─── Auto-snapshot on interaction changes ────────────────────────────────────
let _autoSnapTimer = null;
function scheduleAutoSnapshot() {
    clearTimeout(_autoSnapTimer);
    _autoSnapTimer = setTimeout(() => {
        if (!contextLost && currentModel) captureSnapshot();
    }, 800);
}
orbitControls.addEventListener('end', scheduleAutoSnapshot);
transformControls.addEventListener('mouseUp', scheduleAutoSnapshot);

// ─── Reset ───────────────────────────────────────────────────────────────────
document.getElementById('btn-fullscreen').addEventListener('click', () => {
    camera.position.set(2, 1.5, 3);
    orbitControls.target.set(0, 0, 0);
    orbitControls.update();
    updateCamFields();
});

// ─── Resize ──────────────────────────────────────────────────────────────────
function onResize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h);
    if (camera.isPerspectiveCamera) { camera.aspect = w / h; }
    else { const f = 3, a = w / h; camera.left = -f * a; camera.right = f * a; camera.top = f; camera.bottom = -f; }
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

// ─── Render loop ─────────────────────────────────────────────────────────────
let frameCount = 0;
function animate() {
    requestAnimationFrame(animate);
    if (contextLost) return;
    try {
        orbitControls.update();
        renderer.render(scene, camera);
        if (++frameCount % 30 === 0) updateCamFields();
    } catch (err) {
        console.error('[JS3D] Render error:', err);
    }
}
animate();

// ─── Message handler ─────────────────────────────────────────────────────────
window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || !msg.type) return;
    if (msg.type === 'js3d_load') loadModel(msg.url, msg.format);
    if (msg.type === 'js3d_capture') captureSnapshot();
    if (msg.type === 'js3d_set_background') {
        setBackgroundImage(msg.url || null);
    }
    if (msg.type === 'js3d_set_camera') {
        try {
            const cam = msg.camera;
            if (cam.position) camera.position.set(cam.position.x, cam.position.y, cam.position.z);
            if (cam.target) orbitControls.target.set(cam.target.x, cam.target.y, cam.target.z);
            if (cam.fov && camera.isPerspectiveCamera) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
            if (cam.zoom) { camera.zoom = cam.zoom; camera.updateProjectionMatrix(); }
            orbitControls.update();
            updateCamFields();
        } catch (err) { console.warn('[JS3D] set_camera error:', err); }
    }
});

window.parent.postMessage({ type: 'js3d_ready' }, '*');
</script>
